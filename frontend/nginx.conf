server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Replace this with a proxy when the backend implements the frontend API.
    location /api/ {
        default_type application/json;
        return 503 '{"error":"The library API is not configured yet."}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
